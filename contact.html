<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Eden Consultants</title>
    <meta name="description" content="Get in touch with Eden Consultants for your commercial development project.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-input {
            width: 100%;
            background-color: white;
            border: 1px solid var(--color-slate-200);
            padding: 1rem;
            border-radius: var(--radius-xl);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--color-blue-500);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-slate-700);
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main style="background-color: white; min-height: 100vh;">
        <div style="display: grid; grid-template-columns: 1fr 1fr;">
            <!-- Contact Info Sidebar -->
            <section
                style="background-color: var(--color-slate-900); color: white; padding: 6rem; display: flex; flex-direction: column; justify-content: center;">
                <div style="max-width: 28rem;">
                    <h1
                        style="font-size: 3.5rem; font-weight: 700; margin-bottom: 2rem; color: white; line-height: 1.1;">
                        Let's coordinate your next project.</h1>
                    <p style="font-size: 1.25rem; color: var(--color-slate-400); margin-bottom: 3rem;">
                        Whether you need high-level feasibility notes or full project coordination, we provide the
                        strategic layer developers trust.
                    </p>

                    <div style="display: flex; flex-direction: column; gap: 2rem;">
                        <div style="display: flex; gap: 1.5rem;">
                            <!-- Contact info hidden -->
                        </div>
                        <div style="display: flex; gap: 1.5rem;">
                            <div
                                style="width: 3rem; height: 3rem; background-color: rgba(255, 255, 255, 0.1); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.25rem;">
                                📍</div>
                            <div>
                                <h3 style="font-weight: 700; margin-bottom: 0.25rem; color: white;">Service Area</h3>
                                <p style="color: var(--color-slate-400); margin: 0;">Regional coverage (Specific
                                    territories TBD)</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Discovery Form -->
            <section style="padding: 6rem; background-color: var(--color-slate-50);">
                <div style="max-width: 36rem;">
                    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem;">Request a Discovery Call</h2>

                    <iframe
                        src="https://docs.google.com/forms/d/e/1FAIpQLScRAwIvF6qps5dkOtU90ED5M-L4wGKNDmoj26BOR2kdsYDkcw/viewform?embedded=true"
                        width="640" height="1347" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="data.js"></script>
    <script src="navigation.js"></script>
    <script>
    </script>
</body>

</html>
